<h1>GPA Planner for Science Students</h1>
<p>A free, private CGPA calculator and semester planner for credit-hour programmes on a 0–5 scale, built for Cairo University Faculty of Science. It needs JavaScript. It calculates your CGPA including failed and retaken courses, plans next semester, solves for the average needed to reach a target CGPA, and estimates the German grade. Nothing is uploaded: everything runs in your browser.</p>
<p><a href="https://github.com/SamDozer/gpa-calculator">Source code and documentation</a> · <a href="https://github.com/SamDozer/gpa-calculator/blob/main/README.ar.md">شرح بالعربي (مصري)</a> · <a href="https://github.com/SamDozer/gpa-calculator/blob/main/docs/GRADING_MODEL.md">How the grading model works</a></p>
<p dir="rtl">حاسبة معدل تراكمي مجانية وخاصة لطلبة كلية العلوم جامعة القاهرة بنظام الساعات المعتمدة، بتحسب المعدل مع الرسوب والإعادة وبتخططلك الترم الجاي. بتشتغل على المتصفح بس.</p>
